# Apache reverse proxy example for Suite Digital Fresnillo Web.
#
# Recommended for VPS/dedicated servers:
# 1. Run FastAPI/Uvicorn on 127.0.0.1:8000.
# 2. Let Apache receive public traffic on ports 80/443.
# 3. Proxy requests to Uvicorn.
#
# Enable required Apache modules on Debian/Ubuntu:
#   sudo a2enmod proxy proxy_http headers rewrite ssl

<VirtualHost *:80>
    ServerName ejemplo.com
    ServerAlias www.ejemplo.com

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/suite-digital-error.log
    CustomLog ${APACHE_LOG_DIR}/suite-digital-access.log combined
</VirtualHost>

# For HTTPS, create the certificate with Certbot or your provider and use:
#
# <VirtualHost *:443>
#     ServerName ejemplo.com
#     ServerAlias www.ejemplo.com
#
#     SSLEngine on
#     SSLCertificateFile /etc/letsencrypt/live/ejemplo.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/ejemplo.com/privkey.pem
#
#     ProxyPreserveHost On
#     ProxyRequests Off
#     RequestHeader set X-Forwarded-Proto "https"
#     ProxyPass / http://127.0.0.1:8000/
#     ProxyPassReverse / http://127.0.0.1:8000/
#
#     ErrorLog ${APACHE_LOG_DIR}/suite-digital-ssl-error.log
#     CustomLog ${APACHE_LOG_DIR}/suite-digital-ssl-access.log combined
# </VirtualHost>

