[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "suite-digital-fresnillo"
version = "1.1.0"
description = "Suite de escritorio para flujos administrativos del Municipio de Fresnillo"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "customtkinter==5.2.2",
    "Pillow==9.5.0",
    "PyMuPDF==1.21.1",
    "reportlab==3.6.13",
    "typing_extensions==4.13.2",
    "packaging==23.2",
]

[project.optional-dependencies]
dev = [
    "pyinstaller==5.13.2",
    "pyinstaller-hooks-contrib==2023.8",
    "pytest==7.4.4",
    "ruff==0.9.10",
]

[tool.setuptools.packages.find]
include = [
    "App_Directorio*",
    "App_Organigrama*",
    "App_TestData*",
    "components*",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = [
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F841"]
