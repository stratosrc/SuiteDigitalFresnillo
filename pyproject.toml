[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "suite-digital-fresnillo"
version = "1.1.0"
description = "Suite de escritorio para flujos administrativos del Municipio de Fresnillo"
readme = "README.md"
requires-python = ">=3.10.11,<3.15"
dependencies = [
    "customtkinter==5.2.2",
    "Pillow==12.2.0",
    "PyMuPDF==1.25.5",
    "reportlab==4.5.1",
]

[project.optional-dependencies]
build = [
    "pyinstaller==6.20.0",
    "PyMuPDF==1.25.5",
]
testdata = [
    "PyMuPDF==1.25.5",
]
legacy-mac = [
    "pyinstaller==6.20.0",
]
dev = [
    "pyinstaller==6.20.0",
    "PyMuPDF==1.25.5",
    "pytest==9.0.2",
    "ruff==0.15.5",
]

[tool.setuptools.packages.find]
include = [
    "App_Directorio*",
    "App_Organigrama*",
    "App_TestData*",
    "components*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F841"]
