[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "suite-digital-fresnillo"
version = "2.0.0"
description = "Aplicacion web para flujos administrativos del Municipio de Fresnillo"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "a2wsgi==1.10.10",
    "fastapi==0.128.0",
    "Pillow==12.2.0",
    "PyMuPDF==1.27.2.3",
    "python-multipart==0.0.21",
    "reportlab==4.5.1",
    "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.5",
]

[tool.setuptools.packages.find]
include = [
    "App_ConversorPDF*",
    "App_Directorio*",
    "App_Organigrama*",
    "App_TestData*",
    "Main_View*",
    "components*",
]
exclude = ["App_ConversorPDF.vendor*"]

[tool.setuptools.package-data]
Main_View = ["frontend/*", "frontend/js/**/*.js"]
App_TestData = ["frontend/**/*.js", "frontend/**/*.css"]
App_Organigrama = ["assets/*.png", "frontend/**/*.js", "frontend/**/*.css"]
App_Directorio = ["frontend/*.js", "frontend/*.css"]
App_ConversorPDF = ["frontend/*.js", "frontend/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "App_ConversorPDF/vendor",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F841"]
