name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-13]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project and quality tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Static analysis
        run: python -m ruff check .

      - name: Compile modules
        run: python -m compileall -q App_TestData App_Organigrama App_Directorio components

      - name: Run tests
        run: python -m unittest discover -s tests -v

  pyinstaller-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_path: dist/SuiteFresnillo/SuiteFresnillo.exe
          - os: macos-13
            artifact_path: dist/SuiteFresnillo.app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project and PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Build application
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.11"
        run: |
          python -m PyInstaller --clean --noconfirm suite_fresnillo.spec

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ matrix.artifact_path }}")) {
            throw "PyInstaller did not create ${{ matrix.artifact_path }}"
          }
