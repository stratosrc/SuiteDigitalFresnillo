name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: Install project and quality tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Static analysis
        run: python -m ruff check .

      - name: Compile modules
        run: python -m compileall -q App_TestData App_Organigrama App_Directorio components

      - name: Run tests
        run: python -m unittest discover -s tests -v

  pyinstaller-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: Install project and PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm convertidor.spec
          if (-not (Test-Path "dist/SuiteFresnillo/SuiteFresnillo.exe")) {
            throw "PyInstaller did not create SuiteFresnillo.exe"
          }
